name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test (offline)
        shell: powershell
        run: powershell -NoProfile -File scripts/Test-RogueKit.ps1
